name: Lua Code Style and Unit Tests

on: [pull_request, workflow_dispatch]

jobs:
  lua-code-style:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup lua
        uses: Liquipedia/gh-actions-lua@7615c1c345af98bd9898fa5b53c488c5f58246cf
        with:
          luaVersion: '5.1'

      - name: Setup luarock
        uses: leafo/gh-actions-luarocks@v6

      - name: Setup dependencies
        run: |
          luarocks install --lua-version=5.1 luacheck

      - name: Run lint
        run: |
          luacheck lua --config lua/.luacheckrc |
          luacheck lua --config lua/.luacheckrc --formatter=JUnit > report.xml

      - name: Report lint
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: 'report.xml'
          check_name: 'Lint Report'
          annotate_only: ${{ (github.event.pull_request.head.repo.full_name != github.repository) }}

  lua-unit-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup lua
        uses: Liquipedia/gh-actions-lua@7615c1c345af98bd9898fa5b53c488c5f58246cf
        with:
          luaVersion: '5.1'

      - name: Setup luarocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Setup dependencies
        run: |
          luarocks install --lua-version=5.1 busted

      - name: Run test
        run: |
          busted -C lua -v --run=ci --output=junit > busted.xml

      - name: Report test
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: 'busted.xml'
          check_name: 'Lua Test Report'
          annotate_only: ${{ (github.event.pull_request.head.repo.full_name != github.repository) }}

  luals-code-style:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - id: lua-changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            lua/wikis/**/*.lua

      - name: Setup LuaLS
        if: steps.lua-changed-files.outputs.any_changed == 'true'
        env:
          LUALS_VERSION: 3.18.2
        run: |
          mkdir -p ~/.local/bin/luals
          curl -L https://github.com/LuaLS/lua-language-server/releases/download/$LUALS_VERSION/lua-language-server-$LUALS_VERSION-linux-x64.tar.gz | tar -xzv -C ~/.local/bin/luals

      - name: Check
        if: steps.lua-changed-files.outputs.any_changed == 'true'
        shell: bash
        run: |
          ~/.local/bin/luals/bin/lua-language-server --check ./ | tee luals-check && true
          cat luals-check | (sed -e 's/\x1b\[[0-9;]*m//g'| sed -n 's/\(lua[^:]\+\):\([[:digit:]]*\):[[:digit:]]* \[Warning\] /::error file=\1,line=\2::/p') | (! grep -E $(echo ${{ steps.lua-changed-files.outputs.all_changed_files }} | sed -- 's/ /|/g'))
          echo "| | Files | Errors |" >> $GITHUB_STEP_SUMMARY
          echo "|-|-------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| LuaLS check | $(find lua -name '*.lua' | wc -l) | $(cat luals-check | grep 'Warning' | wc -l) |" >> $GITHUB_STEP_SUMMARY

  lua-annotations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need the base commit to compare against

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Add base commit worktree
        if: github.event_name == 'pull_request'
        run: |
          # HEAD is the PR merge commit, so its first parent is the base branch
          # tip and the delta covers only this PR's own changes. Not
          # pull_request.base.sha: that is the fork point, so it drifts behind as
          # the base branch advances and the delta then also reports commits from
          # everyone else that got merged in.
          if git rev-parse --verify -q HEAD^2 >/dev/null; then
            git worktree add ../base "$(git rev-parse HEAD^1)"
          else
            echo "::warning::HEAD is not a merge commit; deltas will be omitted"
          fi

      - name: Report annotation coverage
        run: |
          # The base tree is measured with *this* PR's script, so the delta
          # reflects the code change rather than a change to how we measure.
          if [ -d ../base ]; then
            set -- --base ../base/lua/wikis/commons
          fi
          python3 scripts/annotation_coverage.py "$@" | tee -a "$GITHUB_STEP_SUMMARY"
