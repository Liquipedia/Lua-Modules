name: Metrics

on: [pull_request, workflow_dispatch]

jobs:
  customization:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need the base commit to compare against

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Add base commit worktree
        if: github.event.pull_request.base.sha != ''
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add ../base "$BASE_SHA"

      - name: Report customization
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The base tree is measured with *this* PR's script, so the delta
          # reflects the code change rather than a change to how we measure.
          if [ -n "$BASE_SHA" ]; then
            set -- --base ../base/lua/wikis
          fi
          python3 scripts/customization_metrics.py "$@" | tee -a "$GITHUB_STEP_SUMMARY"
